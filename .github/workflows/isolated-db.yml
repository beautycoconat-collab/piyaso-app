name: Isolated Supabase regression
on: workflow_dispatch
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIYI_TEST_DATABASE_URL: ${{ secrets.KIYI_TEST_DATABASE_URL }}
      KIYI_TEST_ALLOWED_HOST: ${{ secrets.KIYI_TEST_ALLOWED_HOST }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test-isolated-db.py

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node --test scripts/test-mobile-database.mjs scripts/test-mobile-journeys.mjs scripts/test-apple-database.mjs
