# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
# Audited security fix; keep the normal seven-day quarantine for other releases.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  # CVE-2026-94545: keep the unused OG renderer patched as well.
  satori: 0.33.5
  miniflare>sharp: 0.35.5
  browserslist: 4.28.7
  source-map-js: 1.2.2
  baseline-browser-mapping: 2.11.0
  fast-uri: 3.1.9
  "@babel/core": 7.29.6
  ws: 8.21.0
  undici: 7.30.1
  "js-yaml@^4.1.0": 4.3.2
  "brace-expansion@^1.1.0": 1.1.21
  "brace-expansion@^5.0.0": 5.0.12
  "fflate@0.7.4": 0.7.5
  "fflate@0.7.3": 0.7.5
  image-size: 2.0.4
  react-server-dom-webpack: 19.2.8
  eslint-plugin-react-hooks>zod: 4.6.6
  zod-validation-error>zod: 4.6.6
  esbuild: 0.28.2
